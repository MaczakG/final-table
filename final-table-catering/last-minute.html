<!DOCTYPE html>
<html lang="hu" data-i18n-title="meta.title.lastMinute">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Last Minute Rendezvény — Final Table Catering</title>
<link rel="icon" type="image/svg+xml" href="assets/images/favicon-placeholder.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="lastMinute">

<header id="site-header" class="site-header"></header>

<main>
  <section class="page-hero">
    <div class="container">
      <h1 data-i18n="lastMinute.heroTitle"></h1>
      <p data-i18n="lastMinute.heroLead"></p>
    </div>
  </section>

  <section class="section-dark">
    <div class="container" style="text-align:center;">
      <span class="badge-48h" style="font-size:1.1rem; padding:16px 30px 16px 20px;">
        <span class="badge-number" style="font-size:2rem;">48</span>
        <span data-i18n="lastMinute.badgeHeadline"></span>
      </span>
      <p style="max-width:60ch; margin:20px auto 0; color:var(--almond-200);" data-i18n="lastMinute.badgeText"></p>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="section-head center">
        <span class="eyebrow" data-i18n="lastMinute.howEyebrow"></span>
        <h2 data-i18n="lastMinute.howTitle"></h2>
      </div>
      <div class="grid grid-3">
        <div class="card">
          <span class="eyebrow" data-i18n="lastMinute.step1Time"></span>
          <h3 data-i18n="lastMinute.step1Title"></h3>
          <p data-i18n="lastMinute.step1Text"></p>
        </div>
        <div class="card">
          <span class="eyebrow" data-i18n="lastMinute.step2Time"></span>
          <h3 data-i18n="lastMinute.step2Title"></h3>
          <p data-i18n="lastMinute.step2Text"></p>
        </div>
        <div class="card">
          <span class="eyebrow" data-i18n="lastMinute.step3Time"></span>
          <h3 data-i18n="lastMinute.step3Title"></h3>
          <p data-i18n="lastMinute.step3Text"></p>
        </div>
      </div>
    </div>
  </section>

  <section class="section-alt">
    <div class="container grid grid-2" style="align-items:center;">
      <div>
        <span class="eyebrow" data-i18n="lastMinute.includedEyebrow"></span>
        <h2 data-i18n="lastMinute.includedTitle"></h2>
      </div>
      <ul class="hero-panel" style="list-style:none; margin:0; padding:28px; background:var(--color-surface); border:1px solid var(--almond-200); border-radius:var(--radius-lg); display:grid; gap:14px;">
        <li style="display:flex; gap:10px; color:var(--color-text);"><span style="color:var(--champagne-600); font-weight:700;">&#9670;</span><span data-i18n="lastMinute.included1"></span></li>
        <li style="display:flex; gap:10px; color:var(--color-text);"><span style="color:var(--champagne-600); font-weight:700;">&#9670;</span><span data-i18n="lastMinute.included2"></span></li>
        <li style="display:flex; gap:10px; color:var(--color-text);"><span style="color:var(--champagne-600); font-weight:700;">&#9670;</span><span data-i18n="lastMinute.included3"></span></li>
        <li style="display:flex; gap:10px; color:var(--color-text);"><span style="color:var(--champagne-600); font-weight:700;">&#9670;</span><span data-i18n="lastMinute.included4"></span></li>
      </ul>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="cta-band">
        <div>
          <h2 data-i18n="lastMinute.ctaTitle"></h2>
          <p data-i18n="lastMinute.ctaText" style="margin:0;"></p>
        </div>
        <div class="btn-row">
          <a class="btn btn-champagne" href="tel:+3612345678" data-i18n="common.ctaCall"></a>
          <a class="btn btn-outline" href="quote.html" data-i18n="common.ctaQuote"></a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/i18n.js"></script>
<script src="js/layout.js"></script>
<script>ftInitLayout('lastMinute');</script>
</body>
</html>
