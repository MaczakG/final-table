<!DOCTYPE html>
<html lang="hu" data-i18n-title="meta.title.events">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rendezvények — Final Table Catering</title>
<link rel="icon" type="image/svg+xml" href="assets/images/favicon-placeholder.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="events">

<header id="site-header" class="site-header"></header>

<main>
  <section class="page-hero">
    <div class="container">
      <h1 data-i18n="events.heroTitle"></h1>
      <p data-i18n="events.heroLead"></p>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="section-head center">
        <span class="eyebrow" data-i18n="events.typesEyebrow"></span>
        <h2 data-i18n="events.typesTitle"></h2>
      </div>
      <div class="grid grid-3">
        <div class="card">
          <div class="icon-mark t-motif">T</div>
          <h3 data-i18n="events.type1"></h3>
          <p data-i18n="events.type1Text"></p>
        </div>
        <div class="card">
          <div class="icon-mark t-motif">T</div>
          <h3 data-i18n="events.type2"></h3>
          <p data-i18n="events.type2Text"></p>
        </div>
        <div class="card">
          <div class="icon-mark t-motif">T</div>
          <h3 data-i18n="events.type3"></h3>
          <p data-i18n="events.type3Text"></p>
        </div>
        <div class="card">
          <div class="icon-mark t-motif">T</div>
          <h3 data-i18n="events.type4"></h3>
          <p data-i18n="events.type4Text"></p>
        </div>
        <div class="card">
          <div class="icon-mark t-motif">T</div>
          <h3 data-i18n="events.type5"></h3>
          <p data-i18n="events.type5Text"></p>
        </div>
        <div class="card">
          <div class="icon-mark t-motif">T</div>
          <h3 data-i18n="events.type6"></h3>
          <p data-i18n="events.type6Text"></p>
        </div>
      </div>
    </div>
  </section>

  <section class="section-dark">
    <div class="container">
      <div class="section-head center">
        <span class="eyebrow" style="color:var(--champagne-400);" data-i18n="events.approachEyebrow"></span>
        <h2 data-i18n="events.approachTitle"></h2>
        <div class="divider divider-center"><span class="divider-mark"></span></div>
        <p data-i18n="events.approachText"></p>
      </div>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="cta-band">
        <div>
          <h2 data-i18n="events.ctaTitle"></h2>
          <p data-i18n="events.ctaText" style="margin:0;"></p>
        </div>
        <div class="btn-row">
          <a class="btn btn-champagne" href="quote.html" data-i18n="common.ctaQuote"></a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/i18n.js"></script>
<script src="js/layout.js"></script>
<script>ftInitLayout('events');</script>
</body>
</html>
