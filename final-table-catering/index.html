<!DOCTYPE html>
<html lang="hu" data-i18n-title="meta.title.home">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Table Catering</title>
<link rel="icon" type="image/svg+xml" href="assets/images/favicon-placeholder.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">

<header id="site-header" class="site-header"></header>

<main>
  <section class="hero">
    <div class="container hero-grid">
      <div>
        <span class="eyebrow" data-i18n="home.heroEyebrow" style="color:var(--champagne-400);"></span>
        <h1 data-i18n="home.heroTitle"></h1>
        <p class="lead" data-i18n="home.heroLead"></p>
        <div class="btn-row" style="margin-bottom:22px;">
          <a class="btn btn-champagne" href="quote.html" data-i18n="common.ctaQuote"></a>
          <a class="btn btn-outline" href="tel:+3612345678" data-i18n="common.ctaCall"></a>
        </div>
        <span class="badge-48h">
          <span class="badge-number">48</span>
          <span data-i18n="common.badgeText"></span>
        </span>
      </div>

      <div class="hero-panel">
        <h3 data-i18n="home.heroPanelTitle" style="color:var(--white);"></h3>
        <ul data-i18n-list="home.heroPanelItems"></ul>
      </div>
    </div>
  </section>

  <div class="strip-48h">
    <div class="container strip-track">
      <div><strong>1.</strong> <span data-i18n="common.stripItems.one"></span></div>
      <div><strong>2.</strong> <span data-i18n="common.stripItems.two"></span></div>
      <div><strong>3.</strong> <span data-i18n="common.stripItems.three"></span></div>
    </div>
  </div>

  <section class="section-alt">
    <div class="container">
      <div class="section-head center">
        <span class="eyebrow" data-i18n="home.introEyebrow"></span>
        <h2 data-i18n="home.introTitle"></h2>
        <div class="divider divider-center"><span class="divider-mark"></span></div>
        <p data-i18n="home.introText"></p>
      </div>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="section-head center">
        <h2 data-i18n="home.teaserTitle"></h2>
      </div>
      <div class="grid grid-3">
        <a class="card" href="last-minute.html" style="display:block;">
          <div class="icon-mark t-motif">T</div>
          <h3 data-i18n="home.teaserLastMinuteTitle"></h3>
          <p data-i18n="home.teaserLastMinuteText"></p>
          <span style="color:var(--champagne-600); font-weight:700;" data-i18n="common.readMore"></span>
        </a>
        <a class="card" href="events.html" style="display:block;">
          <div class="icon-mark t-motif">T</div>
          <h3 data-i18n="home.teaserEventsTitle"></h3>
          <p data-i18n="home.teaserEventsText"></p>
          <span style="color:var(--champagne-600); font-weight:700;" data-i18n="common.readMore"></span>
        </a>
        <a class="card" href="services.html" style="display:block;">
          <div class="icon-mark t-motif">T</div>
          <h3 data-i18n="home.teaserServicesTitle"></h3>
          <p data-i18n="home.teaserServicesText"></p>
          <span style="color:var(--champagne-600); font-weight:700;" data-i18n="common.readMore"></span>
        </a>
      </div>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="cta-band">
        <div>
          <h2 data-i18n="home.ctaTitle"></h2>
          <p data-i18n="home.ctaText" style="margin:0;"></p>
        </div>
        <div class="btn-row">
          <a class="btn btn-champagne" href="quote.html" data-i18n="common.ctaQuote"></a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/i18n.js"></script>
<script src="js/layout.js"></script>
<script>ftInitLayout('home');</script>
</body>
</html>
