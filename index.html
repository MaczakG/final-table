<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Table Catering</title>
<meta name="description" content="Final Table Catering — a Final Table Budapest étterem catering márkája. Rendezvényre szabott gasztronómia, akár 48 órán belül.">
<link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header" id="siteHeader">
  <div class="container header-inner">
    <a class="brand" href="#top" aria-label="Final Table Catering — kezdőlap">
      <img src="assets/brand/final-table-logo-11.svg" width="150" height="146" alt="Final Table Catering">
    </a>

    <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="mainNav">
      <span></span><span></span><span></span>
      <span class="visually-hidden">Menü</span>
    </button>

    <nav class="main-nav" id="mainNav" aria-label="Fő navigáció">
      <ul class="nav-list">
        <li><a href="#about" data-i18n="nav.about"></a></li>
        <li><a href="#last-minute" class="nav-highlight" data-i18n="nav.lastMinute"></a></li>
        <li><a href="#events" data-i18n="nav.events"></a></li>
        <li><a href="#quote" data-i18n="nav.quote"></a></li>
        <li><a href="#services" data-i18n="nav.services"></a></li>
        <li><a href="#contact" data-i18n="nav.contact"></a></li>
      </ul>
      <div class="lang-switch" role="group" aria-label="Nyelvváltó">
        <button type="button" data-lang-btn="hu">HU</button>
        <button type="button" data-lang-btn="en">EN</button>
      </div>
    </nav>
  </div>
</header>

<main id="top">

  <!-- ============================= HERO ============================= -->
  <section class="hero">
    <img class="hero-bg" src="assets/images/hero-catering-table.jpg" width="1600" height="2399" alt="" loading="eager">
    <div class="hero-scrim"></div>
    <div class="container">
      <div class="hero-inner reveal">
        <span class="eyebrow eyebrow-light" data-i18n="hero.eyebrow"></span>
        <h1 data-i18n="hero.title"></h1>
        <p class="lead" data-i18n="hero.lead"></p>
        <div class="btn-row">
          <a class="btn btn-peach" href="#quote" data-i18n="common.ctaQuote"></a>
          <!-- CONTACT_PLACEHOLDER: replace href with real tel: once Attila supplies a number -->
          <a class="btn btn-outline" href="#" data-i18n="common.ctaCall"></a>
        </div>
        <span class="badge-48h">
          <svg class="badge-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/></svg>
          <span data-i18n="common.badge"></span>
        </span>
      </div>
    </div>
  </section>

  <!-- ============================= ABOUT ============================= -->
  <section id="about" class="section">
    <div class="container split-grid">
      <div class="split-text reveal">
        <span class="eyebrow" data-i18n="about.eyebrow"></span>
        <h2 data-i18n="about.title"></h2>
        <div class="divider"><span class="divider-mark"></span></div>
        <p data-i18n="about.text1"></p>
        <p data-i18n="about.text2"></p>
      </div>
      <div class="split-photo reveal">
        <img src="assets/images/about-kitchen-team.jpg" width="1200" height="800" data-i18n-alt="about.photoAlt" alt="" loading="lazy">
      </div>
    </div>
  </section>

  <!-- ========================= LAST MINUTE (USP) ========================= -->
  <section id="last-minute" class="section section-feature">
    <img class="feature-bg" src="assets/images/last-minute-catering-service.jpg" width="1200" height="801" alt="" loading="lazy">
    <div class="feature-scrim"></div>
    <div class="container">
      <div class="feature-inner reveal">
        <span class="eyebrow eyebrow-light" data-i18n="lastMinute.eyebrow"></span>
        <h2 data-i18n="lastMinute.title"></h2>
        <p class="lead" data-i18n="lastMinute.lead"></p>
        <span class="badge-48h badge-48h-alt">
          <svg class="badge-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/></svg>
          <span data-i18n="common.badge"></span>
        </span>

        <ol class="steps">
          <li class="reveal">
            <span class="step-time" data-i18n="lastMinute.step1Time"></span>
            <h3 data-i18n="lastMinute.step1Title"></h3>
            <p data-i18n="lastMinute.step1Text"></p>
          </li>
          <li class="reveal">
            <span class="step-time" data-i18n="lastMinute.step2Time"></span>
            <h3 data-i18n="lastMinute.step2Title"></h3>
            <p data-i18n="lastMinute.step2Text"></p>
          </li>
          <li class="reveal">
            <span class="step-time" data-i18n="lastMinute.step3Time"></span>
            <h3 data-i18n="lastMinute.step3Title"></h3>
            <p data-i18n="lastMinute.step3Text"></p>
          </li>
        </ol>
      </div>
    </div>
  </section>

  <!-- ============================= EVENTS ============================= -->
  <section id="events" class="section section-alt">
    <div class="container">
      <div class="section-head center reveal">
        <span class="eyebrow" data-i18n="events.eyebrow"></span>
        <h2 data-i18n="events.title"></h2>
        <div class="divider divider-center"><span class="divider-mark"></span></div>
        <p data-i18n="events.lead"></p>
      </div>

      <div class="split-grid split-grid-rev" style="margin-bottom:40px;">
        <div class="split-photo reveal">
          <img src="assets/images/events-reception-hall.jpg" width="1200" height="1800" data-i18n-alt="events.photoAlt" alt="" loading="lazy">
        </div>
        <div class="grid card-grid" style="align-content:start;">
          <div class="card reveal"><span class="icon-mark">E</span><h3 data-i18n="events.card1Title"></h3><p data-i18n="events.card1Text"></p></div>
          <div class="card reveal"><span class="icon-mark">V</span><h3 data-i18n="events.card2Title"></h3><p data-i18n="events.card2Text"></p></div>
          <div class="card reveal"><span class="icon-mark">P</span><h3 data-i18n="events.card3Title"></h3><p data-i18n="events.card3Text"></p></div>
          <div class="card reveal"><span class="icon-mark">G</span><h3 data-i18n="events.card4Title"></h3><p data-i18n="events.card4Text"></p></div>
          <div class="card reveal"><span class="icon-mark">K</span><h3 data-i18n="events.card5Title"></h3><p data-i18n="events.card5Text"></p></div>
          <div class="card reveal"><span class="icon-mark">M</span><h3 data-i18n="events.card6Title"></h3><p data-i18n="events.card6Text"></p></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============================= QUOTE ============================= -->
  <section id="quote" class="section">
    <div class="container split-grid">
      <div class="split-text reveal">
        <span class="eyebrow" data-i18n="quote.eyebrow"></span>
        <h2 data-i18n="quote.title"></h2>
        <div class="divider"><span class="divider-mark"></span></div>
        <p class="lead" data-i18n="quote.lead"></p>

        <div class="contact-cta-grid">
          <div class="contact-cta-card">
            <h3 data-i18n="quote.callTitle"></h3>
            <p data-i18n="quote.callText"></p>
            <!-- CONTACT_PLACEHOLDER: replace href with real tel: once available -->
            <a class="btn btn-peach-outline" href="#" data-i18n="common.ctaCall"></a>
          </div>
          <div class="contact-cta-card">
            <h3 data-i18n="quote.emailTitle"></h3>
            <p data-i18n="quote.emailText"></p>
            <!-- CONTACT_PLACEHOLDER: replace href with real mailto: once available -->
            <a class="btn btn-peach-outline" href="#" data-i18n="common.ctaEmail"></a>
          </div>
        </div>

        <div class="prep-list">
          <span class="eyebrow" data-i18n="quote.prepEyebrow"></span>
          <h3 data-i18n="quote.prepTitle"></h3>
          <ul>
            <li data-i18n="quote.prep1"></li>
            <li data-i18n="quote.prep2"></li>
            <li data-i18n="quote.prep3"></li>
            <li data-i18n="quote.prep4"></li>
            <li data-i18n="quote.prep5"></li>
          </ul>
        </div>
      </div>
      <div class="split-photo reveal">
        <img src="assets/images/quote-consultation.jpg" width="1600" height="1067" data-i18n-alt="quote.photoAlt" alt="" loading="lazy">
      </div>
    </div>
  </section>

  <!-- ============================= SERVICES ============================= -->
  <section id="services" class="section section-alt">
    <div class="container">
      <div class="section-head center reveal">
        <span class="eyebrow" data-i18n="services.eyebrow"></span>
        <h2 data-i18n="services.title"></h2>
        <div class="divider divider-center"><span class="divider-mark"></span></div>
      </div>

      <div class="split-grid" style="margin-bottom:40px;">
        <div class="grid card-grid" style="align-content:start;">
          <div class="card reveal"><span class="icon-mark icon-mark-blue">M</span><h3 data-i18n="services.card1Title"></h3><p data-i18n="services.card1Text"></p></div>
          <div class="card reveal"><span class="icon-mark icon-mark-blue">B</span><h3 data-i18n="services.card2Title"></h3><p data-i18n="services.card2Text"></p></div>
          <div class="card reveal"><span class="icon-mark icon-mark-blue">D</span><h3 data-i18n="services.card3Title"></h3><p data-i18n="services.card3Text"></p></div>
          <div class="card reveal"><span class="icon-mark icon-mark-blue">F</span><h3 data-i18n="services.card4Title"></h3><p data-i18n="services.card4Text"></p></div>
          <div class="card reveal"><span class="icon-mark icon-mark-blue">L</span><h3 data-i18n="services.card5Title"></h3><p data-i18n="services.card5Text"></p></div>
          <div class="card reveal"><span class="icon-mark icon-mark-blue">C</span><h3 data-i18n="services.card6Title"></h3><p data-i18n="services.card6Text"></p></div>
        </div>
        <div class="split-photo reveal">
          <img src="assets/images/services-bar-cocktail.jpg" width="1200" height="800" data-i18n-alt="services.photoAlt" alt="" loading="lazy">
        </div>
      </div>
    </div>
  </section>

  <!-- ============================= CONTACT ============================= -->
  <section id="contact" class="section">
    <img class="feature-bg" src="assets/images/contact-reception.jpg" width="1600" height="957" alt="" loading="lazy">
    <div class="feature-scrim feature-scrim-strong"></div>
    <div class="container">
      <div class="section-head center reveal" style="max-width:100%;">
        <span class="eyebrow eyebrow-light" data-i18n="contact.eyebrow"></span>
        <h2 class="on-dark" data-i18n="contact.title"></h2>
        <p class="on-dark-muted" data-i18n="contact.lead"></p>
      </div>

      <div class="contact-panel reveal">
        <ul class="contact-list">
          <li>
            <strong data-i18n="contact.phoneLabel"></strong>
            <!-- CONTACT_PLACEHOLDER -->
            <a href="#" data-i18n="common.phonePlaceholder"></a>
          </li>
          <li>
            <strong data-i18n="contact.emailLabel"></strong>
            <!-- CONTACT_PLACEHOLDER -->
            <a href="#" data-i18n="common.emailPlaceholder"></a>
          </li>
          <li>
            <strong data-i18n="contact.addressLabel"></strong>
            <!-- CONTACT_PLACEHOLDER -->
            <span data-i18n="common.addressPlaceholder"></span>
          </li>
          <li>
            <strong data-i18n="contact.hoursLabel"></strong>
            <span data-i18n="contact.hoursText"></span>
          </li>
        </ul>

        <div class="social-row">
          <span class="eyebrow" data-i18n="contact.socialLabel"></span>
          <div class="social-icons">
            <!-- SOCIAL_PLACEHOLDER: wire up real profile URLs when available -->
            <a href="#" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor"/></svg></a>
            <a href="#" aria-label="Facebook"><svg viewBox="0 0 24 24" fill="none"><path d="M14 8.5h2.5V5H14c-2.2 0-4 1.8-4 4v2H8v3.5h2V21h3.5v-6.5H16l.5-3.5h-3V9c0-.6.4-1 1-1Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></a>
            <a href="#" aria-label="Messenger"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3C7 3 3 6.7 3 11.4c0 2.6 1.3 4.9 3.4 6.5V21l3.1-1.7c.8.2 1.6.3 2.5.3 5 0 9-3.7 9-8.4S17 3 12 3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="m7.5 12.3 2.9-3 2.2 2.3 2.9-3-2.9 4.1-2.2-2.2-2.9 3Z" fill="currentColor"/></svg></a>
          </div>
        </div>

        <p class="parent-note" data-i18n="contact.parentNote"></p>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container footer-grid">
    <div>
      <img src="assets/brand/final-table-logo-11.svg" width="120" height="117" class="footer-logo" alt="Final Table Catering">
      <p data-i18n="footer.blurb"></p>
    </div>
    <div>
      <h4 data-i18n="footer.linksTitle"></h4>
      <ul>
        <li><a href="#about" data-i18n="nav.about"></a></li>
        <li><a href="#last-minute" data-i18n="nav.lastMinute"></a></li>
        <li><a href="#events" data-i18n="nav.events"></a></li>
        <li><a href="#quote" data-i18n="nav.quote"></a></li>
        <li><a href="#services" data-i18n="nav.services"></a></li>
        <li><a href="#contact" data-i18n="nav.contact"></a></li>
      </ul>
    </div>
    <div>
      <h4 data-i18n="footer.contactTitle"></h4>
      <ul>
        <!-- CONTACT_PLACEHOLDER -->
        <li><a href="#" data-i18n="common.phonePlaceholder"></a></li>
        <li><a href="#" data-i18n="common.emailPlaceholder"></a></li>
      </ul>
      <p class="footer-parent" data-i18n="footer.parentNote"></p>
    </div>
  </div>
  <div class="container footer-bottom">
    <span>&copy; <span id="ftYear"></span> Final Table Catering.</span>
    <span data-i18n="footer.rights"></span>
  </div>
</footer>

<script src="script.js" defer></script>
</body>
</html>
