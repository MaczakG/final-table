<!DOCTYPE html>
<html lang="hu" data-i18n-title="meta.title.contact">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>document.documentElement.classList.add('js-anim');</script>
<title>Kapcsolat — Final Table Catering</title>
<link rel="icon" type="image/svg+xml" href="assets/images/favicon-placeholder.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">

<header id="site-header" class="site-header"></header>

<main>
  <section class="page-hero">
    <div class="container">
      <h1 data-i18n="contact.heroTitle"></h1>
      <p data-i18n="contact.heroLead"></p>
    </div>
  </section>

  <section>
    <div class="container grid grid-2" style="align-items:flex-start;">
      <div data-animate>
        <span class="eyebrow" data-i18n="contact.infoEyebrow"></span>
        <h2 data-i18n="contact.infoTitle"></h2>
        <ul class="contact-list" style="margin-top:24px;">
          <li>
            <span class="icon-mark t-motif" style="margin:0; width:38px; height:38px; font-size:1rem;">T</span>
            <span><strong data-i18n="contact.phoneLabel"></strong><br><a href="tel:+3612345678">+36 1 234 5678</a></span>
          </li>
          <li>
            <span class="icon-mark t-motif" style="margin:0; width:38px; height:38px; font-size:1rem;">T</span>
            <span><strong data-i18n="contact.emailLabel"></strong><br><a href="mailto:catering@finaltable-budapest.hu">catering@finaltable-budapest.hu</a></span>
          </li>
          <li>
            <span class="icon-mark t-motif" style="margin:0; width:38px; height:38px; font-size:1rem;">T</span>
            <span><strong data-i18n="contact.addressLabel"></strong><br><span data-i18n="contact.addressText"></span></span>
          </li>
        </ul>
      </div>

      <div class="card-dark" data-animate>
        <h3 data-i18n="contact.hoursLabel" style="color:var(--champagne-300);"></h3>
        <p data-i18n="contact.hoursText"></p>
        <p data-i18n="contact.hoursTextUrgent" style="margin-bottom:22px;"></p>
        <div class="divider" style="border-top:1px solid rgba(217,184,118,0.3); margin:0 0 20px;"></div>
        <h3 data-i18n="contact.parentTitle" style="color:var(--champagne-300);"></h3>
        <p data-i18n="contact.parentText" style="margin:0;"></p>
      </div>
    </div>
  </section>

  <section class="section-alt">
    <div class="container">
      <div class="cta-band" style="background:linear-gradient(135deg, var(--teal-900), var(--teal-950));" data-animate>
        <div>
          <span class="badge-48h">
            <span class="badge-number">48</span>
            <span data-i18n="common.badgeText"></span>
          </span>
        </div>
        <div class="btn-row">
          <a class="btn btn-champagne" href="tel:+3612345678" data-i18n="common.ctaCall"></a>
          <a class="btn btn-outline" href="mailto:catering@finaltable-budapest.hu" data-i18n="common.ctaEmail"></a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/i18n.js"></script>
<script src="js/layout.js"></script>
<script src="js/animate.js"></script>
<script>ftInitLayout('contact');</script>
</body>
</html>
