<!DOCTYPE html>
<html lang="hu" data-i18n-title="meta.title.about">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rólunk — Final Table Catering</title>
<link rel="icon" type="image/svg+xml" href="assets/images/favicon-placeholder.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="about">

<header id="site-header" class="site-header"></header>

<main>
  <section class="page-hero">
    <div class="container">
      <h1 data-i18n="about.heroTitle"></h1>
      <p data-i18n="about.heroLead"></p>
    </div>
  </section>

  <div class="section-photo">
    <img src="assets/images/about-kitchen-team.jpg" data-i18n-alt="about.teamPhotoAlt" alt="" loading="lazy" width="1200" height="800">
  </div>

  <section>
    <div class="container grid grid-2" style="align-items:center;">
      <div>
        <span class="eyebrow" data-i18n="about.storyEyebrow"></span>
        <h2 data-i18n="about.storyTitle"></h2>
        <p data-i18n="about.storyText1"></p>
        <p data-i18n="about.storyText2"></p>
      </div>
      <div class="card-dark">
        <div class="icon-mark t-motif" style="border-color:var(--champagne-400); color:var(--champagne-300);">T</div>
        <p style="color:var(--almond-100); font-family:var(--font-display); font-size:1.3rem; margin:0;" data-i18n="common.parentNote"></p>
      </div>
    </div>
  </section>

  <section class="section-alt">
    <div class="container">
      <div class="section-head center">
        <span class="eyebrow" data-i18n="about.valuesEyebrow"></span>
        <h2 data-i18n="about.valuesTitle"></h2>
      </div>
      <div class="grid grid-4">
        <div class="card">
          <div class="icon-mark t-motif">T</div>
          <h3 data-i18n="about.value1Title"></h3>
          <p data-i18n="about.value1Text"></p>
        </div>
        <div class="card">
          <div class="icon-mark t-motif">T</div>
          <h3 data-i18n="about.value2Title"></h3>
          <p data-i18n="about.value2Text"></p>
        </div>
        <div class="card">
          <div class="icon-mark t-motif">T</div>
          <h3 data-i18n="about.value3Title"></h3>
          <p data-i18n="about.value3Text"></p>
        </div>
        <div class="card">
          <div class="icon-mark t-motif">T</div>
          <h3 data-i18n="about.value4Title"></h3>
          <p data-i18n="about.value4Text"></p>
        </div>
      </div>
    </div>
  </section>

  <section class="section-dark">
    <div class="container">
      <div class="section-head center">
        <span class="eyebrow" style="color:var(--champagne-400);" data-i18n="about.teamEyebrow"></span>
        <h2 data-i18n="about.teamTitle"></h2>
        <div class="divider divider-center"><span class="divider-mark"></span></div>
        <p data-i18n="about.teamText"></p>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/i18n.js"></script>
<script src="js/layout.js"></script>
<script>ftInitLayout('about');</script>
</body>
</html>
